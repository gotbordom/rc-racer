# Hard stop from 3 m/s at mu 0.5: the drive slows the wheel at 3 m/s^2, the
# tyres hold less, so the car slides on faster than its wheels. The slide
# must be flagged within 0.3 s of the body getting 0.15 m/s ahead of its
# wheels (from ground truth), and the estimate must stay inside 3 sigma.
# How hard it slides varies between runs (2.5-2.8 m/s^2), so the check is
# timed from the slide, not from the start of braking (spec Open Item 5).
# Runs 2026-11-23: detected ~1.1 s after braking began, or not at all.
# Fixed 2026-11-24 (2.4): a tighter threshold for a wheel behind while
# braking. The slide reached 0.15 m/s 0.64-0.65 s in; slip was flagged
# 0.02 s before that, on two runs.
id: VAL-006
title: Braking slide is detected as it reaches 0.15 m/s (mu 0.5)
tire_mu: 0.5
steps:
  - {duration: 3.0, speed: 0.0, speed_end: 3.0}
  - {duration: 1.0, speed: 3.0}
  - {duration: 3.0, speed: 0.0, expect_slip_after_gap: {gap: 0.15, within: 0.3}}
checks:
  min_consistent_fraction: 0.95
  never_error: true
  ends_ok: true
  settles: true
