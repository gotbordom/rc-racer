# Hard stop from 3 m/s at mu 0.5: the drive slows the wheel at 3 m/s^2, the
# tyres hold ~1.7 m/s^2, so the car slides on faster than its wheels. The
# slide must be detected within 0.5 s, as a launch slip is. Run 2026-11-23:
# detected ~1.1 s after braking began, near the end of the slide (error
# 0.09 m, inside 3 sigma) (spec Open Item 5).
id: VAL-006
title: Braking slip from 3 m/s is detected within 0.5 s (mu 0.5)
tire_mu: 0.5
steps:
  - {duration: 3.0, speed: 0.0, speed_end: 3.0}
  - {duration: 1.0, speed: 3.0}
  - {duration: 3.0, speed: 0.0, expect_slip_within: 0.5}
checks:
  min_consistent_fraction: 0.95
  never_error: true
  ends_ok: true
  settles: true
expected_fail:
  reason: "braking slip is detected late, near the end of the slide (VEH.GNC.SE spec Open Item 5)"
  failing: "slip in step 2"
