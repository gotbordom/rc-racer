# =============================================================================
# RC Racer Docker Compose - Microservices Architecture
# =============================================================================
# Each ROS 2 package runs in its own container, communicating via DDS
#
# Usage (Docker Compose V2 - CLI plugin):
#   docker compose up -d simulation  # Start Gazebo simulation
#   docker compose up -d dev         # Start dev container for building/testing
#   docker compose exec dev bash     # Enter dev container
#   docker compose up simulation dev # Run both together
#   docker compose down              # Stop all containers
#
# Cross-container communication:
#   All containers share 'ros-network' and ROS_DOMAIN_ID=0
#   Topics published by simulation are visible in dev container
# =============================================================================

services:
  # ===========================================================================
  # Simulation Container - Headless (for CI / no GUI)
  # ===========================================================================
  # Runs Gazebo server without GUI - use for CI and automated testing
  # Other containers subscribe to: /imu/data, /gps/fix, /camera/image_raw
  simulation:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simulation
    image: rc-racer-simulation:latest
    container_name: rc-racer-simulation
    hostname: rc-racer-simulation
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    networks:
      - ros-network
    # Headless mode - no GUI
    command: ["ros2", "launch", "rc_racer_simulation", "simulation.launch.py", "headless:=true"]

  # ===========================================================================
  # Simulation Container - With GUI (for development)
  # ===========================================================================
  # Runs Gazebo with GUI - requires: xhost +local:docker
  # Mounts rc_racer_simulation from the working tree and rebuilds it on start,
  # so URDF/world/launch edits only need a restart (no image rebuild)
  # Opens the practice course; pick another world with e.g.:
  #   SIM_WORLD=empty_course.world docker compose up simulation-gui
  simulation-gui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simulation
    image: rc-racer-simulation:latest
    container_name: rc-racer-simulation-gui
    hostname: rc-racer-simulation
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      # Live simulation package (overrides the copy baked into the image)
      - ../src/rc_racer_simulation:/ros2_ws/src/rc_racer_simulation:ro
      # X11 for Gazebo GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # GPU support (if available)
      - /dev/dri:/dev/dri
    networks:
      - ros-network
    # GUI mode - rebuild the mounted package, then launch
    command:
      - bash
      - -c
      - >
        colcon build --packages-select rc_racer_simulation &&
        source install/setup.bash &&
        ros2 launch rc_racer_simulation simulation.launch.py headless:=false
        world:=${SIM_WORLD:-practice_course.world}

  # ===========================================================================
  # Manual driving: sim GUI + state_estimation + RViz + Xbox controller
  # ===========================================================================
  # docker compose -f docker/docker-compose.yml up sim-manual
  # Hold LB, left stick = speed, right stick = turn, RB = turbo.
  # Keyboard instead: docker exec -it rc-racer-sim-manual bash -c
  #   "source install/setup.bash && ros2 run teleop_twist_keyboard teleop_twist_keyboard"
  sim-manual:
    image: rc-racer-simulation:latest
    container_name: rc-racer-sim-manual
    hostname: rc-racer-simulation
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # SDL's udev lookup finds no controllers in the container (the host's
      # udev data lacks the joystick tag here); scan /dev/input instead
      - SDL_JOYSTICK_DISABLE_UDEV=1
      # Controller mappings missing from Humble's SDL (2.0.20). Without one,
      # SDL guesses a layout and scrambles buttons and axes (e.g. a stick
      # read as a half-range trigger). Format: GUID,name,mapping; one per
      # line. GUIDs come from `ros2 run joy joy_enumerate_devices`.
      #   Xbox One Elite 2, Bluetooth, firmware 0x0523 (the entries for
      #   0x0513/0x0517 in SDL_GameControllerDB; raw layout checked by hand)
      - "SDL_GAMECONTROLLERCONFIG=050000005e040000220b000023050000,Xbox One Elite 2 Controller,a:b0,b:b1,back:b10,dpdown:h0.4,dpleft:h0.8,dpright:h0.2,dpup:h0.1,guide:b12,leftshoulder:b6,leftstick:b13,lefttrigger:a5,leftx:a0,lefty:a1,rightshoulder:b7,rightstick:b14,righttrigger:a4,rightx:a2,righty:a3,start:b11,x:b3,y:b4,platform:Linux,"
    volumes:
      # Live sources for the packages under test (built on start)
      - ../src:/ros2_ws/src:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      # Game controller: bind /dev/input (not --device) so a pad plugged in
      # after start still appears
      - /dev/input:/dev/input
    device_cgroup_rules:
      - "c 13:* rmw"  # input devices (js*, event*)
    networks:
      - ros-network
    command:
      - bash
      - -c
      - >
        colcon build --packages-up-to rc_racer_bringup &&
        source install/setup.bash &&
        ros2 launch rc_racer_bringup sim_manual.launch.py
        world:=${SIM_WORLD:-practice_course.world}
        tire_mu:=${SIM_TIRE_MU:-0.5}

  # ===========================================================================
  # Development Container (Building & Testing)
  # ===========================================================================
  # Interactive development - builds and runs your ROS 2 nodes
  # Connects to simulation container via shared network
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    image: rc-racer-dev:latest
    container_name: rc-racer-dev
    hostname: rc-racer-dev
    stdin_open: true
    tty: true
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      # Mount source code (edits on host are immediately available)
      - ../src:/ros2_ws/src/rc-racer/src:rw
      - ../test:/ros2_ws/src/rc-racer/test:rw
      - ../launch:/ros2_ws/src/rc-racer/launch:rw
      - ../config:/ros2_ws/src/rc-racer/config:rw
      # Persist build artifacts (faster rebuilds)
      - rc-racer-build:/ros2_ws/build
      - rc-racer-install:/ros2_ws/install
      - rc-racer-log:/ros2_ws/log
      # X11 for GUI applications
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # GPU support (if available)
      - /dev/dri:/dev/dri
    networks:
      - ros-network
    command: ["bash"]

  # ===========================================================================
  # CI Container
  # ===========================================================================
  # Lean container for running tests (no GUI)
  # Uses separate ROS_DOMAIN_ID to avoid interference with simulation
  ci:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ci
    image: rc-racer-ci:latest
    container_name: rc-racer-ci
    environment:
      - ROS_DOMAIN_ID=99
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ../src:/ros2_ws/src/rc-racer/src:ro
      - ../test:/ros2_ws/src/rc-racer/test:ro
      - ./ci-results:/ros2_ws/log:rw
    networks:
      - ros-network
    command: >
      bash -c "
        colcon build --symlink-install &&
        colcon test --packages-skip rc_racer_system_tests &&
        colcon test-result --verbose
      "

  # ===========================================================================
  # CI with Simulation (for integration/system tests)
  # ===========================================================================
  # Runs simulation + tests together for full integration testing
  ci-with-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simulation
    image: rc-racer-simulation:latest
    container_name: rc-racer-ci-sim
    environment:
      - ROS_DOMAIN_ID=99
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Headless mode for CI
      - DISPLAY=
      - LIBGL_ALWAYS_SOFTWARE=1
    networks:
      - ros-network
    # Start Gazebo in headless/server mode
    command: ["ros2", "launch", "rc_racer_simulation", "simulation.launch.py"]

  # ===========================================================================
  # Hardware Container (On Robot)
  # ===========================================================================
  # For deployment on actual robot hardware
  # Use on Jetson/Pi with physical sensors attached
  hardware:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rc-racer:latest
    container_name: rc-racer-hardware
    runtime: nvidia
    network_mode: host
    privileged: true
    volumes:
      - ../src:/workspace/src
      - ../launch:/workspace/launch
      - /dev:/dev
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
    devices:
      - /dev/video0:/dev/video0  # Camera
      - /dev/video1:/dev/video1  # Camera (if second camera)
      - /dev/ttyUSB0:/dev/ttyUSB0  # GPS/Serial devices
      - /dev/i2c-1:/dev/i2c-1  # IMU
    command: /bin/bash

# ===========================================================================
# Volumes
# ===========================================================================
# Named volumes for build artifacts (persist across container restarts)
volumes:
  rc-racer-build:
  rc-racer-install:
  rc-racer-log:

# ===========================================================================
# Networks
# ===========================================================================
networks:
  ros-network:
    driver: bridge
