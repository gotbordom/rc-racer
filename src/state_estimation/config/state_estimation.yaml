#
# state_estimation parameters (VEH.GNC.SE spec §3.4). Moves to
# rc_racer_bringup/config/ when that package exists (Conventions §7).
# Values marked TBD are first guesses, tuned in the L2 sim test.

state_estimation:
  ros__parameters:
    publish_rate: 50.0              # Hz, predict + publish
    publish_tf: true                # odom -> base_footprint (only publisher)
    motion_model: bicycle           # bicycle (Ackermann) | unicycle (differential)
    fusion:
      method: ekf                   # ekf (ukf, complementary planned)
    robot:
      wheelbase: 0.384              # m, rc_racer.urdf.xacro
      max_steering_angle: 0.52      # rad, wheels.urdf.xacro
      rear_axle_offset: 0.192       # m, rear axle forward to base_footprint (midway)
    inputs:
      imu:
        timeout: 0.1                # s, ICD-SNS-GNC §5
      wheel_odom:
        timeout: 0.2                # s, ICD-SNS-GNC §5
        scale_stddev: 0.01          # encoder scale error (calibration, tyre wear) (TBD)
    process_noise:
      accel: 0.003                  # (m/s^2)^2/s with IMU acceleration as input (TBD)
      accel_no_imu: 4.0             # (m/s^2)^2/s when the IMU is stale (TBD)
      yaw_accel: 1.0                # (rad/s^2)^2/s (TBD)
      distance: 1.0e-3              # m^2/m along-track, varying wheel scale / scrub (TBD)
    slip:
      threshold: 0.3                # m/s, on top of 3 sigma of predicted speed (TBD)
      yaw_rate_margin: 0.2          # rad/s beyond the steering limit (TBD)
      window: 0.5                   # s, wheel vs estimate-then + IMU since (TBD)
      max_duration: 2.0             # s, longest IMU-only stretch while slipping (TBD)
    stationary:                     # wheel ~0 and IMU quiet: stopped, ends slip (TBD)
      speed: 0.05                   # m/s
      yaw_rate: 0.05                # rad/s
      accel: 0.3                    # m/s^2
      variance_scale: 1000000.0       # wheel variance factor while slipping (TBD)
      correction_uncertainty: 0.3     # share of a retroactive slip correction kept as 1-sigma (TBD)
      braking_accel: 0.5              # m/s^2: wheel behind the IMU counts as slip only when braking (TBD)
      braking_threshold: 0.15         # m/s: tighter window threshold for that case, a braking slide (TBD)
      correction_time: 0.5            # s: a retroactive slip correction is spread over this (TBD)
      lateral_threshold: 0.5          # m/s^2: lateral accel short of wheel speed x yaw rate = understeer (TBD)
      lateral_min_yaw_rate: 0.3       # rad/s: understeer is checked only when turning faster (TBD)
      accel_span: 0.2                 # s: wheel vs IMU acceleration compared over this (TBD)
      accel_margin: 0.6               # m/s^2: mismatch beyond this grows the wheel variance (TBD)
      accel_gain: 0.5                 # s: extra wheel sigma = gain x excess mismatch (TBD)
      impact_accel: 8.0               # m/s^2: deceleration beyond this is an impact (TBD)
      impact_lookback: 0.25           # s: an impact this recent counts for a new slip (TBD)
      pinned_speed: 0.3               # m/s: after an impact, IMU speed under this + quiet IMU = pinned (TBD)
      pinned_max_duration: 10.0       # s: backstop on holding the speed at 0 while pinned (TBD)
    initial_covariance:
      pose: 1.0e-6
      speed: 1.0
      yaw_rate: 0.1
