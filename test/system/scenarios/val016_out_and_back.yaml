# Out and back (issue #8): 10 m straight out, then straight back. The
# published variance falls on the way back (the scale term shrinks with
# distance from the start) and then grows again (distance noise). The true
# error must stay inside 3 sigma throughout, so the dip is honest.
id: VAL-016
title: Out and back, covariance dips and stays honest (mu 0.5)
tire_mu: 0.5
steps:
  - {duration: 1.0, speed: 0.0, speed_end: 1.0}
  - {duration: 9.0, speed: 1.0}
  - {duration: 2.0, speed: 1.0, speed_end: -1.0}
  - {duration: 9.0, speed: -1.0}
  - {duration: 1.0, speed: -1.0, speed_end: 0.0}
  - {duration: 2.0, speed: 0.0}
checks:
  max_position_error: 0.3
  min_consistent_fraction: 0.95
  slip_events: {max: 0}
  never_error: true
  ends_ok: true
  settles: true
  covariance_dip: {min_drop: 0.03}
