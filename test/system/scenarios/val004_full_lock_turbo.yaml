# Full-lock turbo at mu 0.5, left then right. At 3 m/s full lock asks for
# ~13 m/s^2 of lateral grip; the tyres hold ~4.9 m/s^2, so the car slides.
# It understeers: slip angle 10-17 deg, yaw rate 1.4-2.6 rad/s (the
# steering would allow 4.5). Speed ramps up straight first so the launch
# does not slip. This checks warning, recovery and never getting stuck;
# whether the estimate and covariance stay honest in the slide is VAL-018.
# Runs 2026-11-23: slip flagged 2.5-2.9 s into each turn; max error
# 1.5-1.76 m, final 0.63-0.81 m over ~32 m; heading within 1 deg. Some
# runs step 0.07-0.09 m when slip ends (VAL-018), hence max_jump 0.15.
id: VAL-004
title: Full-lock turbo slide warns, recovers, never stuck (mu 0.5)
tire_mu: 0.5
steps:
  - {duration: 3.0, speed: 0.0, speed_end: 3.0}
  - {duration: 4.0, speed: 3.0, steer: 1.0, expect_slip: true}
  - {duration: 1.0, speed: 3.0}
  - {duration: 4.0, speed: 3.0, steer: -1.0, expect_slip: true}
  - {duration: 2.0, speed: 3.0, speed_end: 0.0}
  - {duration: 3.0, speed: 0.0}
checks:
  max_position_error: 2.5
  max_jump: 0.15              # the step when a slide's slip ends is VAL-018's (0.07-0.09 m)
  max_yaw_error_deg: 2.0
  slip_events: {min: 2}
  never_error: true
  ends_ok: true
  settles: true
