# Full-lock circles at 1 m/s, left then right. At full lock the yaw rate is
# at the steering limit, which the yaw-rate slip check must not flag
# (slip.yaw_rate_margin). Lateral acceleration ~1.5 m/s^2, inside grip.
id: VAL-003
title: Full-lock circles both ways, no false slip (mu 0.5)
tire_mu: 0.5
steps:
  - {duration: 1.0, speed: 0.0, speed_end: 1.0}
  - {duration: 10.0, speed: 1.0, steer: 1.0}
  - {duration: 10.0, speed: 1.0, steer: -1.0}
  - {duration: 1.0, speed: 1.0, speed_end: 0.0}
  - {duration: 2.0, speed: 0.0}
checks:
  max_position_error: 0.3
  max_yaw_error_deg: 3.0
  min_consistent_fraction: 0.95
  slip_events: {max: 0}
  never_error: true
  ends_ok: true
  settles: true
