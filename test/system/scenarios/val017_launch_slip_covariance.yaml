# The launch of VAL-005, checking the covariance while the slip develops.
# Until the windowed slip check fires (~0.45 s) the filter trusts the
# spinning wheel: the estimate runs ahead (1.2 m/s against a true 0.75) and
# builds ~0.1 m of along-track error while the reported sigma is ~0.02 m.
# Runs 2026-11-23: ~16 % of the first second's samples outside 3 sigma.
id: VAL-017
title: Covariance stays honest while a launch slip develops (mu 0.5)
tire_mu: 0.5
steps:
  - {duration: 1.0, speed: 3.0, min_consistent_fraction: 0.95}
  - {duration: 2.0, speed: 3.0}
  - {duration: 2.0, speed: 3.0, speed_end: 0.0}
  - {duration: 2.0, speed: 0.0}
checks:
  never_error: true
  ends_ok: true
expected_fail:
  reason: "the covariance is overconfident until the slip is detected (VEH.GNC.SE spec Open Item 6)"
  failing: "step 0: only"
