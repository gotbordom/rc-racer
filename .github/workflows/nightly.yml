# =============================================================================
# RC Racer Nightly Build
# =============================================================================
# Runs: Daily at 2 AM UTC
# Purpose: Run slow system tests, full validation
#
# Runs inside the simulation image (docker/Dockerfile.simulation) so system
# tests get Gazebo Fortress + ros_gz. The image is built here (with layer
# caching) rather than pulled, so the nightly also validates the Dockerfile.
#
# Gazebo runs headless with software rendering - GitHub runners have no GPU.
# =============================================================================

name: Nightly

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

env:
  ROS_DISTRO: humble
  SIM_IMAGE: rc-racer-simulation:nightly

jobs:
  system-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: src/rc-racer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build simulation image
        uses: docker/build-push-action@v5
        with:
          context: src/rc-racer
          file: src/rc-racer/docker/Dockerfile.simulation
          load: true
          tags: ${{ env.SIM_IMAGE }}
          cache-from: type=gha,scope=simulation
          cache-to: type=gha,scope=simulation,mode=max

      - name: Build and run all tests (including system tests)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/ws" \
            -w /ws \
            -e ROS_DOMAIN_ID=42 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            ${{ env.SIM_IMAGE }} \
            bash -c '
              set -e
              apt-get update
              rosdep update --rosdistro ${{ env.ROS_DISTRO }}
              rosdep install --from-paths src --ignore-src -y --rosdistro ${{ env.ROS_DISTRO }}
              colcon build --symlink-install
              source install/setup.bash
              colcon test --event-handlers console_direct+
              colcon test-result --verbose
            '

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results
          path: build/*/test_results/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Nightly build failed! Check test results."
