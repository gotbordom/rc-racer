# Reverse with turns both ways. Speed ramps at 1 m/s^2 so nothing slips at
# mu 0.5. The heading must follow truth closely in reverse.
id: VAL-002
title: Reverse with turns, heading within 1 degree (mu 0.5)
tire_mu: 0.5
steps:
  - {duration: 1.0, speed: 0.0, speed_end: -1.0}
  - {duration: 4.0, speed: -1.0, steer: 0.5}
  - {duration: 4.0, speed: -1.0, steer: -0.5}
  - {duration: 2.0, speed: -1.0}
  - {duration: 1.0, speed: -1.0, speed_end: 0.0}
  - {duration: 2.0, speed: 0.0}
checks:
  max_position_error: 0.2
  max_yaw_error_deg: 1.0
  min_consistent_fraction: 0.95
  slip_events: {max: 0}
  never_error: true
  ends_ok: true
  settles: true
